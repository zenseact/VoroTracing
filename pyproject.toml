[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vorotracing"
version = "0.1.0"
description = "VoroTracing training and inference code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.1",
    "jaxtyping>=0.3.3",
    "matplotlib>=3.10.7",
    "nerfview>=0.1.3",
    "ninja>=1.13.0",
    "numpy>=2.3.4",
    "opencv-python>=4.11.0.86",
    "packaging>=25.0",
    "pycolmap>=3.13.0",
    "rich>=14.2.0",
    "scipy>=1.14.0",
    "splines>=0.3.3",
    "torch>2.7.0",
    "tqdm>=4.67.1",
    "tyro>=0.9.35",
    "wandb>=0.22.3",
    "torchmetrics[image]>=1.8.2",
    "pytorch-msssim>=1.0.0",
    "pybind11>=3.0.1",
    "viser>=1.0.15",
    "pandas>=2.3.3",
    "PyYAML>=6.0.2",
    "paragram @ git+https://github.com/zenseact/paragram.git",
    "romav2 @ git+https://github.com/Parskatt/RoMaV2.git",
]

[dependency-groups]
dev = [
    "ruff==0.14.6",
]

[tool.ruff]
exclude = ["external"]

[tool.setuptools.packages.find]
include = ["vorotracing*"]

[tool.setuptools.package-data]
vorotracing = [
    "cuda/csrc/**/*.cpp",
    "cuda/csrc/**/*.cu",
    "cuda/csrc/**/*.cuh",
    "cuda/csrc/**/*.h",
]
